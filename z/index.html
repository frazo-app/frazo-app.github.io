<!doctype html>
<!-- PROPOSAL from ticket 04 (not pushed): frazo-site z/index.html. The App Link opens the app when it is installed and
     verified; this page is what a phone WITHOUT the app sees, and what an in-app browser (Messenger, WhatsApp) shows
     when it does not hand the link to Android. Not verified on a device. -->
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zadanie Frazo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FFF0D0; color: #1E2A4A; margin: 0; padding: 24px 16px; }
    main { max-width: 420px; margin: 0 auto; }
    a.btn { display: block; text-align: center; padding: 16px; margin: 12px 0; border-radius: 16px; font-weight: 700;
            text-decoration: none; border: 3px solid #1E2A4A; }
    .open { background: #58CC02; color: #1E2A4A; }
    .store { background: #fff; color: #1E2A4A; }
    p.small { font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
<main>
  <h1>Zadanie ze słówek od nauczyciela</h1>
  <p>Ten link otwiera Zadanie w aplikacji Frazo na telefonie dziecka. Rodzic przyjmuje je po wpisaniu PIN-u.</p>
  <a class="btn open" id="open" href="#">Otwórz w aplikacji Frazo</a>
  <a class="btn store" href="https://play.google.com/store/apps/details?id=com.tomsoftix.english">Pobierz Frazo z Google Play</a>
  <p class="small">Po zainstalowaniu aplikacji wróć do wiadomości od nauczyciela i otwórz ten link jeszcze raz.</p>
</main>
<script>
  // An in-app browser often keeps https links to itself; an intent: URL asks Android to open the same link in the app.
  // Without the app, Chrome follows S.browser_fallback_url to Google Play.
  var here = location.host + location.pathname + location.search;
  var play = "https://play.google.com/store/apps/details?id=com.tomsoftix.english";
  document.getElementById("open").href =
    "intent://" + here + "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;" +
    "S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
</script>
</body>
</html>
